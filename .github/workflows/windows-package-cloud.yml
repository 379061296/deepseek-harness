# Cloud copy of .github/workflows/windows-package.yml. It differs in the runner
# label, the input defaults, and how the public package settings are supplied:
# the upstream workflow targets the self-hosted label dsh-win-package-trial and
# takes the machine preset configured there, while this copy runs on a hosted
# runner and writes apps/desktop/.env.windows itself.
#
# The settings file is written here because the Desktop CI adapter now refuses to
# run without DSH_PACKAGING_PRESET, which selects presets/<preset>.env under an
# absolute machine configuration directory owned by the packaging machine. The
# documented public settings file reaches the same packaging command without a
# machine preset, which is what keeps this copy runnable on a hosted runner.
#
# The build version defaults to the version the checkout publishes, so the
# installer is named deepseek-harness-<version>-win-x64-unsigned.exe. Upstream's
# default appends the UTC date and the run number, which puts that suffix in the
# file name.
name: Windows installer (unsigned, cloud)

on:
  workflow_dispatch:
    inputs:
      build_version:
        description: 'Build version: product publishes the checkout version; auto appends a date and run number; otherwise enter a full version'
        type: string
        default: product
        required: true
      deployment:
        description: Update policy deployment
        type: choice
        options: [test, production]
        default: test
        required: true
      policy_origin:
        description: 'Required update policy HTTPS origin (no path)'
        type: string
        default: 'https://updates.example.com'
        required: true
      login_origins:
        description: 'Required for test: comma-separated allowed login HTTPS origins'
        type: string
        default: 'https://login.example.com'
        required: false

permissions:
  contents: read

concurrency:
  group: windows-desktop-package-cloud
  cancel-in-progress: false

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    env:
      DSH_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7.0.1
        id: checkout
        with:
          persist-credentials: false
          clean: true
      - uses: pnpm/action-setup@v5.0.0
        with:
          dest: ${{ runner.temp }}/setup-pnpm-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - name: Install locked dependencies
        run: |
          pnpm install --frozen-lockfile
          exit $LASTEXITCODE
      - name: Resolve the build version
        id: build_version
        run: |
          $requested = "${{ inputs.build_version }}".Trim()
          if ($requested -eq 'product') {
            $requested = (Get-Content -LiteralPath apps/desktop/package.json -Raw | ConvertFrom-Json).version
          }
          if ([string]::IsNullOrWhiteSpace($requested)) {
            throw 'no build version could be resolved'
          }
          Write-Host "build version: $requested"
          "version=$requested" >> $env:GITHUB_OUTPUT
      - name: Write public package settings
        id: settings
        env:
          PACKAGE_VERSION: ${{ steps.build_version.outputs.version }}
          PACKAGE_DEPLOYMENT: ${{ inputs.deployment }}
          PACKAGE_POLICY_ORIGIN: ${{ inputs.policy_origin }}
          PACKAGE_LOGIN_ORIGINS: ${{ inputs.login_origins }}
        run: |
          $deployment = $env:PACKAGE_DEPLOYMENT
          if ($deployment -ne 'test' -and $deployment -ne 'production') {
            throw 'deployment must be test or production'
          }
          $origins = @($env:PACKAGE_LOGIN_ORIGINS -split ',' | ForEach-Object { $_.Trim() } | Where-Object { $_ })
          if ($deployment -eq 'test' -and $origins.Count -eq 0) {
            throw 'the test deployment requires at least one login origin'
          }
          if ($deployment -eq 'production' -and $origins.Count -gt 0) {
            throw 'the production deployment must not supply login origins'
          }
          if ([string]::IsNullOrWhiteSpace($env:PACKAGE_POLICY_ORIGIN)) {
            throw 'a policy origin is required'
          }
          $originKey = if ($deployment -eq 'test') {
            'DSH_DESKTOP_MANDATORY_UPDATE_TEST_ORIGIN'
          } else {
            'DSH_DESKTOP_MANDATORY_UPDATE_PROD_ORIGIN'
          }
          $config = if ($deployment -eq 'test') { @{ allowedAuthOrigins = $origins } } else { @{} }
          @(
            'DSH_DESKTOP_APP_ID=com.deepseek.harness'
            "DSH_DESKTOP_AUTO_UPDATE_ENV=$deployment"
            "$originKey=$($env:PACKAGE_POLICY_ORIGIN)"
            "DSH_DESKTOP_MANDATORY_UPDATE_CONFIG=$($config | ConvertTo-Json -Compress)"
          ) | Set-Content -LiteralPath apps/desktop/.env.windows -Encoding utf8NoBOM
          Get-Content -LiteralPath apps/desktop/.env.windows
          "version=$($env:PACKAGE_VERSION)" >> $env:GITHUB_OUTPUT
      - name: Check packaging configuration and toolchain
        env:
          PACKAGE_VERSION: ${{ steps.settings.outputs.version }}
        run: |
          pnpm run package:desktop:win:x64:unsigned --check --build-version "$env:PACKAGE_VERSION"
          exit $LASTEXITCODE
      - name: Build installer and verify packaged runtime
        env:
          PACKAGE_VERSION: ${{ steps.settings.outputs.version }}
        run: |
          pnpm run package:desktop:win:x64:unsigned --build-version "$env:PACKAGE_VERSION"
          exit $LASTEXITCODE
      - name: Retain packaging diagnostics
        if: always() && steps.checkout.outcome == 'success'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: cloud-package-logs-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: apps/desktop/.desktop-build/packaging-runs/
          if-no-files-found: warn
          retention-days: 14
      - name: Retain verified installer
        uses: actions/upload-artifact@v7.0.1
        with:
          name: cloud-win-x64-unsigned-${{ steps.settings.outputs.version }}-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/*.exe
          if-no-files-found: error
          retention-days: 14
      - name: Remove generated package settings
        if: always() && steps.checkout.outcome == 'success'
        run: |
          if (Test-Path -LiteralPath apps/desktop/.env.windows) {
            Remove-Item -LiteralPath apps/desktop/.env.windows
          }