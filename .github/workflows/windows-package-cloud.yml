# Cloud copy of .github/workflows/windows-package.yml. It differs in the runner
# label and the input defaults: the upstream workflow targets the self-hosted
# label dsh-win-package-trial, which no hosted runner can match, and the inputs
# carry defaults so it can be dispatched as is.
#
# The build version defaults to the version the checkout publishes, so the
# installer is named deepseek-harness-<version>-win-x64-unsigned.exe. Upstream's
# default appends the UTC date and the run number, which puts that suffix in the
# file name.
name: Windows installer (unsigned, cloud)

on:
  workflow_dispatch:
    inputs:
      build_version:
        description: 'Build version: product publishes the checkout version; auto appends a date and run number; otherwise enter a full version'
        type: string
        default: product
        required: true
      deployment:
        description: Update policy deployment
        type: choice
        options: [test, production]
        default: test
        required: true
      policy_origin:
        description: 'Required update policy HTTPS origin (no path)'
        type: string
        default: 'https://updates.example.com'
        required: true
      login_origins:
        description: 'Required for test: comma-separated allowed login HTTPS origins'
        type: string
        default: 'https://login.example.com'
        required: false

permissions:
  contents: read

concurrency:
  group: windows-desktop-package-cloud
  cancel-in-progress: false

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    env:
      DSH_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7.0.1
        id: checkout
        with:
          persist-credentials: false
          clean: true
      - uses: pnpm/action-setup@v5.0.0
        with:
          dest: ${{ runner.temp }}/setup-pnpm-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - name: Install locked dependencies
        run: |
          pnpm install --frozen-lockfile
          exit $LASTEXITCODE
      - name: Resolve the build version
        id: build_version
        run: |
          $requested = "${{ inputs.build_version }}".Trim()
          if ($requested -eq 'product') {
            $requested = (Get-Content -LiteralPath apps/desktop/package.json -Raw | ConvertFrom-Json).version
          }
          if ([string]::IsNullOrWhiteSpace($requested)) {
            throw 'no build version could be resolved'
          }
          Write-Host "build version: $requested"
          "version=$requested" >> $env:GITHUB_OUTPUT
      - name: Validate inputs and prepare public package settings
        id: settings
        env:
          PACKAGE_BUILD_VERSION: ${{ steps.build_version.outputs.version }}
          PACKAGE_DEPLOYMENT: ${{ inputs.deployment }}
          PACKAGE_POLICY_ORIGIN: ${{ inputs.policy_origin }}
          PACKAGE_LOGIN_ORIGINS: ${{ inputs.login_origins }}
        run: node apps/desktop/scripts/prepare-windows-ci.mjs
      - name: Check packaging configuration and toolchain
        env:
          PACKAGE_VERSION: ${{ steps.settings.outputs.version }}
        run: |
          pnpm run package:desktop:win:x64:unsigned --check --build-version "$env:PACKAGE_VERSION"
          exit $LASTEXITCODE
      - name: Build installer and verify packaged runtime
        env:
          PACKAGE_VERSION: ${{ steps.settings.outputs.version }}
        run: |
          pnpm run package:desktop:win:x64:unsigned --build-version "$env:PACKAGE_VERSION"
          exit $LASTEXITCODE
      - name: Retain packaging diagnostics
        if: always() && steps.checkout.outcome == 'success'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: cloud-package-logs-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: apps/desktop/.desktop-build/packaging-runs/
          if-no-files-found: warn
          retention-days: 14
      - name: Retain verified installer
        uses: actions/upload-artifact@v7.0.1
        with:
          name: cloud-win-x64-unsigned-${{ steps.settings.outputs.version }}-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/*.exe
          if-no-files-found: error
          retention-days: 14
      - name: Remove generated package settings
        if: always() && steps.checkout.outcome == 'success'
        run: |
          if (Test-Path -LiteralPath apps/desktop/.env.windows) {
            Remove-Item -LiteralPath apps/desktop/.env.windows
          }