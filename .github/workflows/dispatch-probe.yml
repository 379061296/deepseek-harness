# Temporary probe: proves the token in a workflow run can start another workflow
# with the same command the sync workflow uses to start packaging.
name: Dispatch probe

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch the sync workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run mirror-upstream.yml --repo "$GITHUB_REPOSITORY" --ref master
          echo 'dispatch accepted'