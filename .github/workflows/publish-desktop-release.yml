# Publish a finished desktop build so it can be downloaded without digging
# through Actions artifacts, which expire after 14 days.
#
# The release is named after the version the installer was built from, not after
# the run that built it: that is what a reader looks for, and it keeps one
# release per version and platform. A second build of a version already
# published replaces that release's installer.
#
# This listens for the cloud packaging workflow instead of adding a step to it,
# so the packaging workflow keeps the shape of its upstream original and a
# publish failure cannot mark a finished build as failed.
name: Publish desktop installer

on:
  workflow_run:
    workflows: ['Windows installer (unsigned, cloud)']
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Packaging run id to publish; leave empty to use the triggering run'
        required: false
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-desktop-installer
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Resolve the packaging run
        id: src
        env:
          DISPATCH_RUN_ID: ${{ inputs.run_id }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          run_id="${DISPATCH_RUN_ID:-$TRIGGER_RUN_ID}"
          if [ -z "$run_id" ]; then
            echo 'no packaging run id to publish'
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "publishing run $run_id"

      - name: Download the installer artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh run download '${{ steps.src.outputs.run_id }}' \
            --repo '${{ github.repository }}' \
            --pattern 'cloud-win-x64-unsigned-*' \
            --dir dist
          find dist -type f -name '*.exe' -print

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          set -euo pipefail
          exe=$(find dist -type f -name '*.exe' | head -n1)
          if [ -z "$exe" ]; then
            echo 'the packaging run produced no installer artifact'
            exit 1
          fi
          # Publish the installer under the name its published version carries,
          # without the unsigned marker, so it downloads as
          # deepseek-harness-<version>-win-x64.exe.
          dir=$(dirname "$exe")
          name=$(basename "$exe")
          clean=$(printf '%s' "$name" | sed 's/-unsigned\.exe$/.exe/')
          if [ "$clean" != "$name" ]; then
            mv -- "$exe" "$dir/$clean"
            exe="$dir/$clean"
          fi
          name=$(basename "$exe")
          # The version has to come from the installer: this job never checks the
          # product out, and the run id it is handed says nothing about which
          # version that run built.
          version=$(printf '%s' "$name" | sed -n 's/^deepseek-harness-\(.*\)-win-x64\.exe$/\1/p')
          if [ -z "$version" ]; then
            echo "no version in '$name'; expected deepseek-harness-<version>-win-x64.exe"
            exit 1
          fi
          echo "installer to publish: $name (version $version)"
          run_id='${{ steps.src.outputs.run_id }}'
          sha=$(gh run view "$run_id" --repo '${{ github.repository }}' --json headSha --jq .headSha)
          tag="deepseek-harness-$version-win-x64"
          # Upstream publishes alpha and rc versions as prereleases; mark ours the
          # same way, so a finished stable version keeps the 'Latest' mark.
          prerelease=
          case "$version" in
            *-*) prerelease='--prerelease' ;;
          esac
          notes=$(printf '%s\n' \
            "来自打包运行 ${run_id} 的 Windows x64 安装包，版本 ${version}。" \
            "" \
            "来源：deepseek-ai/deepseek-harness 的镜像，对应提交 ${sha}。" \
            "架构：x64。")
          if gh release view "$tag" --repo '${{ github.repository }}' >/dev/null 2>&1; then
            # The tag already names this version, so a rebuild of it lands here.
            # Replace the installer; the tag stays on the commit of the first
            # build of this version.
            echo "release $tag exists; replacing its installer"
            gh release upload "$tag" "$exe" --repo '${{ github.repository }}' --clobber
            gh release edit "$tag" --repo '${{ github.repository }}' \
              --title "DeepSeek Harness $version（Windows x64）" \
              --notes "$notes" $prerelease
          else
            gh release create "$tag" "$exe" \
              --repo '${{ github.repository }}' \
              --target "$sha" \
              --title "DeepSeek Harness $version（Windows x64）" \
              --notes "$notes" $prerelease
          fi
          gh release view "$tag" --repo '${{ github.repository }}' --json url --jq .url
