# Keep this mirror in step with deepseek-ai/deepseek-harness, and package each
# newly published version of it.
#
# `git push --mirror` cannot be used here: master carries local changes upstream
# does not have, and --mirror would drop them. Merging keeps them, because
# upstream never touches those paths, so the merge normally cannot conflict.
#
# The push uses the default GITHUB_TOKEN. GitHub does not start workflow runs
# from that token's pushes, so this workflow starts the packaging run itself
# when the version changes.
name: Sync upstream

on:
  schedule:
    # UTC, off the top of the hour. Every three hours rather than hourly: the
    # packaging run costs about an hour of wall clock anyway, so a shorter sync
    # interval barely shortens the time to a downloadable installer while it
    # spends minutes the packaging runs need.
    - cron: '41 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

env:
  PACKAGE_WORKFLOW: windows-package-cloud.yml
  PACKAGE_WORKFLOW_NAME: 'Windows installer (unsigned, cloud)'
  # Safety valve, not a routine limit: stop starting builds once this many have
  # been started in the last 30 days, so a burst of releases cannot exhaust the
  # account's Actions minutes and starve everything else.
  MAX_BUILDS_PER_MONTH: '12'

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out this mirror with full history
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Merge upstream
        id: merge
        run: |
          set -euo pipefail
          git config user.name 'upstream sync'
          git config user.email 'upstream-sync@users.noreply.github.com'
          before=$(git rev-parse HEAD)
          echo "mirror before: $before"
          git remote add upstream https://github.com/deepseek-ai/deepseek-harness.git
          git fetch --force --tags upstream 'refs/heads/*:refs/remotes/upstream/*'
          echo "upstream master: $(git rev-parse upstream/master)"
          git merge --no-edit upstream/master || true
          # This mirror drops the Dependabot configuration on purpose: dependency
          # update pull requests are noise here and their runs consume Actions
          # minutes. If upstream edits that file the merge stops with a
          # modify/delete conflict, so restate the deletion and finish the merge.
          git rm -f --ignore-unmatch .github/dependabot.yml
          git add -A
          if [ -f .git/MERGE_HEAD ]; then
            conflicted=$(git diff --name-only --diff-filter=U)
            if [ "$conflicted" != ".github/dependabot.yml" ]; then
              echo "unexpected merge conflict in: $conflicted"
              exit 1
            fi
            git rm -f .github/dependabot.yml
            git commit --no-edit
          fi
          after=$(git rev-parse HEAD)
          echo "mirror after: $after"
          echo "before=$before" >> "$GITHUB_OUTPUT"
          echo "after=$after" >> "$GITHUB_OUTPUT"

      - name: Push branch and tags
        run: |
          set -euo pipefail
          git push origin HEAD:master
          git push --force origin --tags

      - name: Package a newly published version
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ steps.merge.outputs.before }}
          AFTER: ${{ steps.merge.outputs.after }}
        run: |
          set -euo pipefail
          version_of() {
            git show "$1:package.json" | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])'
          }
          before_version=$(version_of "$BEFORE")
          after_version=$(version_of "$AFTER")
          echo "version: $before_version -> $after_version"
          if [ "$before_version" = "$after_version" ]; then
            echo 'no version change; nothing to package'
            exit 0
          fi
          since=$(date -u -d '30 days ago' +%Y-%m-%dT%H:%M:%SZ)
          # Count by workflow name rather than by file name: the run list reports
          # the name, and an unusable count must never stop packaging. This is the
          # one branch a version-less sync cannot exercise, so it fails safe.
          recent=$(gh run list --repo "$GITHUB_REPOSITORY" --limit 200 \
            --json workflowName,createdAt \
            --jq "[.[] | select(.workflowName == \"$PACKAGE_WORKFLOW_NAME\" and .createdAt >= \"$since\")] | length" \
            2>/dev/null) || recent=0
          case "$recent" in
            '' | *[!0-9]*) echo "warning: unusable run count '$recent'; proceeding"; recent=0 ;;
          esac
          echo "packaging runs started in the last 30 days: $recent"
          if [ "$recent" -ge "$MAX_BUILDS_PER_MONTH" ]; then
            echo "monthly packaging allowance of $MAX_BUILDS_PER_MONTH runs is used up; skipping $after_version"
            exit 0
          fi
          gh workflow run "$PACKAGE_WORKFLOW" --repo "$GITHUB_REPOSITORY" --ref master
          echo "requested a packaging run for version $after_version"

      - name: Report
        if: always()
        run: |
          {
            echo "### Upstream sync"
            echo ""
            echo "- mirror master: \`$(git rev-parse HEAD 2>/dev/null || echo unknown)\`"
            echo "- upstream master: \`$(git rev-parse upstream/master 2>/dev/null || echo unknown)\`"
          } >> "$GITHUB_STEP_SUMMARY"